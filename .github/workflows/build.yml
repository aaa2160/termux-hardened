name: build-termux-hardened
on:
  push:
    branches: [ hardened, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 29.0.14206865
        run: |
          sdkmanager --install "ndk;29.0.14206865" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_VERSION=29.0.14206865" >> $GITHUB_ENV
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk || ls -R app/build/outputs/
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --print-certs --verbose app/build/outputs/apk/debug/*universal*.apk 2>&1 | head -n 50 || true
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/*universal*.apk 2>&1 | head -n 30 || true
      - uses: actions/upload-artifact@v4
        with:
          name: termux-hardened-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Build release (unsigned, for F-Droid style)
        if: github.ref == 'refs/heads/hardened'
        run: ./gradlew assembleRelease --stacktrace || echo "release needs keystore - debug is primary"

