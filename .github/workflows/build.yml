name: build-termux-hardened

on:
  push:
    branches: [ hardened, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERMUX_KEYSTORE_B64: ${{ secrets.TERMUX_KEYSTORE_B64 }}
      TERMUX_KEYSTORE_PASS: ${{ secrets.TERMUX_KEYSTORE_PASS }}
      TERMUX_KEY_ALIAS: ${{ secrets.TERMUX_KEY_ALIAS }}
      TERMUX_APP_VERSION_NAME: 0.118.3-hardened
      TERMUX_APK_VERSION_TAG: hardened
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and platforms (SDK is preinstalled on runners)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
          "$SDKM" --list_installed | head -n 30

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify signatures and metadata
        run: |
          ls -lh app/build/outputs/apk/release/ app/build/outputs/apk/debug/
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk ==="
            $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$apk" | head -n 6
            $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk" | grep -E "^package|targetSdk|sdkVersion" || true
          done

      - name: Publish to GitHub release (hardened-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete hardened-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create hardened-latest --repo "$GITHUB_REPOSITORY" \
            --title "Termux Hardened Build" \
            --notes "Automated hardened build from commit $GITHUB_SHA.

          - Signed with private 4096-bit RSA key (v1+v2+v3 schemes)
          - PendingIntent FLAG_IMMUTABLE fixes
          - Cleartext traffic blocked via networkSecurityConfig
          - targetSdk per gradle.properties; release build minified (R8)

          Install the arm64-v8a APK on modern phones; universal APK works everywhere." \
            app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: termux-hardened-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
